<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<!-- 코드명: 지비스 사용량 PWA | index.html | @version 1.3.0 -->
<!-- 폰을 PC 옆에 두고 보는 화면 — 지비스가 올린 Claude·Gemini 사용량과 LG·아수스 PC 의 CPU·램을 10초마다 받아 그린다.
     주소·열쇠는 이 저장소에 없다: 폰에서 «연결 코드» 를 한 번 붙여넣으면 그 폰(localStorage)에만 저장된다. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="사용량">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/favicon-32.png">
<title>지비스 사용량</title>
<style>
/* ── 테마 여섯 — 지비스 ui.css 의 값을 그대로(기본 = 슬레이트 라이트) ── */
:root{--bg:#F7F7FF;--fg:#27187E;--accent:#27187E;--on:#F7F7FF;--now:#0E7C58;
  --card:color-mix(in srgb,var(--fg) 10%,var(--bg));--card2:color-mix(in srgb,var(--fg) 18%,var(--bg));
  --line:color-mix(in srgb,var(--fg) 30%,var(--bg));--dim:color-mix(in srgb,var(--fg) 65%,var(--bg));--fg2:color-mix(in srgb,var(--fg) 88%,var(--bg))}
:root[data-theme="black"]{--bg:#15181d;--fg:#eef1f5;--accent:#ff8b3d;--now:#35c98b;--on:#1a1206;--card:#1c2027;--card2:#262c35;--line:#2b313a;--dim:#97a1ae;--fg2:#c3cbd6}
:root[data-theme="slatelight"]{--bg:#f8fafc;--fg:#0f172a;--accent:#8b5cf6;--on:#ffffff;--now:#059669;--card:#ffffff;--card2:#f1f5f9;--line:#e2e8f0;--dim:#475569;--fg2:#1e293b}
:root[data-theme="chillwhite"]{--bg:#FFF9FA;--fg:#2B1116;--accent:#FD1843;--on:#FFF9FA;--now:#0E7C58;--card:#FDEFF1;--card2:#F9DFE3;--line:#EFC7CE;--dim:#7A5860;--fg2:#43222A}
:root[data-theme="night"]{--bg:#222222;--fg:#EFF3E8;--accent:#89E900;--on:#222222;--now:#C6FF6B;--card:#2C2E29;--card2:#383B33;--line:#43473D;--dim:#9AA394;--fg2:#D3D9CC}
:root[data-theme="gold"]{--bg:#0F0F0F;--fg:#F3E5AB;--accent:#D4AF37;--on:#0F0F0F;--now:#4FD6A0;--card:#1F1E1A;--card2:#2D2B23;--line:#413E31;--dim:#8C8565;--fg2:#D8CB98}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:0 2px 12px}
.tl{display:flex;align-items:baseline;gap:7px;min-width:0}
.ver{font-size:12px;font-weight:600;color:var(--dim);white-space:nowrap}
.top b{font-size:17px;font-weight:700}
.tr{display:flex;align-items:center;gap:10px}
.conn{display:flex;align-items:center;gap:6px;font-size:clamp(11px,3vw,12px);color:var(--now);white-space:nowrap}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--now);display:inline-block}
.conn.warn{color:#b76e00}.conn.warn i{background:#e6a030}
.conn.bad{color:#c22222}.conn.bad i{background:#e04040}
.gear{border:1px solid var(--line);background:var(--card);border-radius:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:16px}
.gr{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:560px){.gr{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
@media (min-width:1000px){.gr{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);max-width:1100px;margin:0 auto}}
.col{display:grid;gap:12px;align-content:start}
.cd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px}
.hd{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:2px 8px;margin-bottom:6px}
.hd b{font-size:15px;font-weight:700}
.hd b.tt{display:flex;align-items:center;gap:7px}
.lg{flex:0 0 auto}
.rw{display:flex;gap:6px;justify-content:space-around}
.rg{text-align:center;flex:1 1 0;min-width:0}
.rg svg{max-width:100%;height:auto}
.lb{font-size:clamp(11px,3vw,12.5px);color:var(--fg2);margin-top:2px}
.sb{font-size:clamp(10px,2.9vw,11.5px);color:var(--dim);overflow-wrap:anywhere}
.rg .sb.rm{margin-top:1px;color:var(--fg2)}
.rg .sb.at{margin-top:1px}
.nb{display:inline-block;white-space:nowrap}
.sb.old{color:#b76e00}
.bar{height:9px;border-radius:5px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .5s}
.pcs{display:grid;gap:12px;align-content:start}
.mt{margin-top:8px}.mt .r{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.pill.on{background:color-mix(in srgb,var(--now) 22%,var(--bg));color:var(--now)}
.pill.off{background:color-mix(in srgb,#e6a030 24%,var(--bg));color:#b76e00}
.foot{margin:14px 2px 0;font-size:11px;color:var(--dim);text-align:center}
.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;text-align:center;font-size:14px;color:var(--fg2);line-height:1.6}
.msg h2{margin:0 0 6px;font-size:16px;color:var(--fg)}
textarea{width:100%;min-height:96px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:10px;font:13px/1.4 ui-monospace,Consolas,monospace;resize:vertical}
.btn{border:none;background:var(--accent);color:var(--on);border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700;width:100%;margin-top:10px}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500}
.err{color:#c22222;font-size:13px;margin-top:8px;min-height:18px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.sheet h3{margin:0 0 8px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:transparent}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.row{margin:0 0 14px}
</style></head>
<body>
<div id="app"></div>
<script>
(function () {
'use strict';
var VER = '1.3.0', POLL_MS = 10000, ONLINE_MS = 60000, STALE_AI_MS = 15 * 60000;
var THEMES = [['ghost', '고스트'], ['black', '블랙'], ['slatelight', '슬레이트 라이트'], ['chillwhite', '칠화이트'], ['night', '나이트'], ['gold', '금박']];
var S = { isDef: false, manual: false, conn: null, snap: null, fetchedAt: 0, err: '', theme: 'slatelight', wake: true, sheet: false, confirmOff: false, codeErr: '' };
var app = document.getElementById('app'), wl = null, timer = null, busy = false;

function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* 저장 막힌 브라우저 */ } return null; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

/* ── 기본 연결 (연결 코드 없이 열리게) ──
   ★ 공개 저장소에 들어가는 값이다 — 그래서 «읽기 전용 열쇠» 만 넣는다. 읽기(api=get)만 되고 PC 가 올리는 쓰기(POST)는 거절된다.
     쓰기 열쇠(진짜 열쇠)는 여기 없다. 폰에서 직접 «연결 코드» 를 넣으면 그것이 기본 연결보다 먼저 쓰인다. */
var DEF = { u: 'https://script.google.com/macros/s/AKfycbxSo2JG7SdQcuBMiurOMOv8mUzSEcggckDho5AFDcnnyLP44F5Tn7wx8lB2Z5gCOKixaw/exec', k: 'jvrbM0Dn6XIXvoAK3pmXWayC5CN' };

/* ── 연결 코드 ── */
function parseCode(raw) {
  var m = String(raw || '').match(/JVUSG1:([A-Za-z0-9+/=_-]+)/); if (!m) return null;
  try {
    var b = m[1].replace(/-/g, '+').replace(/_/g, '/'); while (b.length % 4) b += '=';
    var j = JSON.parse(decodeURIComponent(escape(atob(b))));
    if (!j.u || !j.k || String(j.k).length < 16 || String(j.u).indexOf('https://script.google.com/macros/s/') !== 0) return null;
    return { u: String(j.u), k: String(j.k) };
  } catch (e) { return null; }
}

/* ── 색 ── */
function lum(hex) { var h = String(hex).replace('#', '').trim(); if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join(''); return (0.299 * parseInt(h.substr(0, 2), 16) + 0.587 * parseInt(h.substr(2, 2), 16) + 0.114 * parseInt(h.substr(4, 2), 16)) / 255; }
function isDark() { return lum(getComputedStyle(document.documentElement).getPropertyValue('--bg') || '#fff') < 0.5; }
var TD = [[0, '#5b8def'], [40, '#e0b010'], [60, '#f08a2a'], [80, '#ee6a30'], [90, '#e04040']];
var TL = [[0, '#3f6fd1'], [40, '#c99a06'], [60, '#d9791e'], [80, '#d3541f'], [90, '#c22222']];
function tone(p) { var T = isDark() ? TD : TL, c = T[0][1]; T.forEach(function (t) { if (p >= t[0]) c = t[1]; }); return c; }

/* ── 시간 ── */
function nowSrv() { return S.snap ? S.snap.now + (Date.now() - S.fetchedAt) : Date.now(); }
function ago(ms) { var s = Math.max(0, Math.round(ms / 1000)); if (s < 60) return s + '초 전'; var m = Math.floor(s / 60); if (m < 60) return m + '분 전'; var h = Math.floor(m / 60); return h < 24 ? h + '시간 전' : Math.floor(h / 24) + '일 전'; }
function fmtResetParts(ts) {                                               // [«10/6(화)», «13:50»]
  var d = new Date(ts), dow = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
  var p2 = function (n) { return (n < 10 ? '0' : '') + n; };
  return [(d.getMonth() + 1) + '/' + d.getDate() + '(' + dow + ')', p2(d.getHours()) + ':' + p2(d.getMinutes())];
}
function fmtReset(ts) {                                                      // 10/5(월) 23:00 — 폰의 현재 시간대 그대로
  var d = new Date(ts), dow = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
  var p2 = function (n) { return (n < 10 ? '0' : '') + n; };
  return (d.getMonth() + 1) + '/' + d.getDate() + '(' + dow + ') ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}
/* ★ 주간 한도는 «목요일 오후 11:00» 처럼 요일이 붙어 온다. 옛 PC 지비스는 시각만 읽어 «오늘 23:00» 으로 계산해
   (목요일 초기화가 «46분 남음» 으로 보였다, 2026-10-06) — 그래서 폰도 문구에 요일·날짜가 있으면 문구를 따른다. */
function resetFromText(t, nowMs) {
  var s = String(t || ''), m = s.match(/(오전|오후|AM|PM)?\s*(\d{1,2})\s*:\s*(\d{2})\s*(AM|PM)?/i);
  if (!m || /\d+\s*(?:시간|분|hours?|hrs?|mins?|minutes?)\s*(?:후|뒤|later)?/i.test(s.replace(/\d+\s*월\s*\d+\s*일/, ''))) return null;
  var h = Number(m[2]), ap = (m[1] || m[4] || '').toUpperCase(), min = Number(m[3]), now = new Date(nowMs);
  if (ap === '오후' || ap === 'PM') { if (h < 12) h += 12; } if (ap === '오전' || ap === 'AM') { if (h === 12) h = 0; }
  var md = s.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if (md) { var d1 = new Date(now.getFullYear(), Number(md[1]) - 1, Number(md[2]), h, min, 0, 0); if (d1.getTime() <= nowMs) d1.setFullYear(d1.getFullYear() + 1); return d1.getTime(); }
  var dow = -1, ko = s.match(/([일월화수목금토])\s*요일/) || s.match(/(?:^|[\s(])([일월화수목금토])(?=[\s)\d]|오전|오후|$)/);
  if (ko) dow = '일월화수목금토'.indexOf(ko[1]);
  else { var en = s.match(/\b(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/i); if (en) dow = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'].indexOf(en[1].toLowerCase()); }
  if (dow < 0) return null;                                   // 요일·날짜가 없으면 PC 가 보낸 값을 믿는다
  var at = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, min, 0, 0);
  at.setDate(at.getDate() + ((dow - now.getDay() + 7) % 7));
  if (at.getTime() <= nowMs) at.setDate(at.getDate() + 7);
  return at.getTime();
}
function remain(w) {                                                          // → [«3시간 14분 남음», «10/6(화)», «13:50»] (시각 없으면 뒤 둘은 빈 글자)
  var fix = resetFromText(w.resetRel || w.reset, nowSrv());
  if (fix) w = { resetAt: fix };
  if (w.resetAt) {
    var ms = w.resetAt - nowSrv(); if (ms <= 0) return ['초기화됨', '', ''];
    var m = Math.floor(ms / 60000), h = Math.floor(m / 60), days = ms / 86400000, t;
    if (days >= 1.95) t = Math.round(days) + '일 남음';                       // 2.99일 → 3일 (내림하면 «2일» 로 보인다)
    else if (days >= 1) t = '1일 ' + (h % 24) + '시간 남음';
    else if (h >= 1) t = h + '시간 ' + (m % 60) + '분 남음'; else t = m + '분 남음';
    var ap = fmtResetParts(w.resetAt);
    return [t, ap[0], ap[1]];
  }
  return [w.resetRel ? String(w.resetRel).replace(/후$/, '남음') : '', '', ''];
}

/* ── 그리기 ── */
function ring(p, s) {
  var r = s / 2 - 6, c = 2 * Math.PI * r, d = c * (1 - p / 100), h = s / 2;
  return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '" role="img" aria-label="' + p + '퍼센트"><circle cx="' + h + '" cy="' + h + '" r="' + r + '" fill="none" stroke="var(--card2)" stroke-width="7"/><circle cx="' + h + '" cy="' + h + '" r="' + r + '" fill="none" stroke="' + tone(p) + '" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + d.toFixed(1) + '" transform="rotate(-90 ' + h + ' ' + h + ')"/><text x="' + h + '" y="' + (h + 6) + '" text-anchor="middle" font-size="18" font-weight="700" fill="var(--fg)">' + Math.round(p) + '</text></svg>';
}
function item(name, w) {
  var r = remain(w);
  /* 첫 줄: 남은 시간. 둘째 줄: (날짜 시각) — 좁으면 날짜와 시각 «사이» 에서만 줄이 바뀐다(글자가 쪼개져 잘리지 않게) */
  return '<div class="rg">' + ring(w.pct, 74) + '<div class="lb">' + name + '</div><div class="sb rm">' + esc(r[0]) + '</div>'
    + (r[1] ? '<div class="sb at"><span class="nb">(' + esc(r[1]) + '</span> <span class="nb">' + esc(r[2]) + ')</span></div>' : '') + '</div>';
}
/* 서비스 로고 — Claude 는 주황 방사형 별, Gemini 는 파랑→보라 네 갈래 반짝이(둘 다 단순화한 모양) */
var LOGO_N = 0;
function logo(kind) {
  if (kind === 'claude') {
    var L = [9.6, 7.4, 10.4, 8, 9.8, 7.2, 10.2, 8.2, 9.4, 7.6, 10.4, 8], rays = '';
    for (var i = 0; i < 12; i++) { var a = i * Math.PI / 6 - Math.PI / 2, r0 = 2.6; rays += '<line x1="' + (12 + r0 * Math.cos(a)).toFixed(2) + '" y1="' + (12 + r0 * Math.sin(a)).toFixed(2) + '" x2="' + (12 + L[i] * Math.cos(a)).toFixed(2) + '" y2="' + (12 + L[i] * Math.sin(a)).toFixed(2) + '"/>'; }
    return '<svg class="lg" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g stroke="#d97757" stroke-width="2.5" stroke-linecap="round">' + rays + '</g></svg>';
  }
  if (kind === 'gemini') {
    var id = 'gg' + (++LOGO_N);
    return '<svg class="lg" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="' + id + '" x1="3" y1="21" x2="21" y2="3" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4285F4"/><stop offset=".55" stop-color="#9b72cb"/><stop offset="1" stop-color="#d96570"/></linearGradient></defs><path fill="url(#' + id + ')" d="M12 0C12 6.6 17.4 12 24 12C17.4 12 12 17.4 12 24C12 17.4 6.6 12 0 12C6.6 12 12 6.6 12 0Z"/></svg>';
  }
  return '';
}
function aiCard(title, color, u, aiTs, devName, kind) {
  var wins = [['5시간', u.session], ['주간', u.weekly], ['Fable', u.fable]].filter(function (x) { return x[1]; });
  var age = aiTs ? nowSrv() - aiTs : 0, old = age > STALE_AI_MS;
  var body = u.needsLogin && !wins.length ? '<div class="sb" style="padding:10px 0;font-size:13px">PC 지비스에서 로그인이 필요해요</div>'
    : (wins.length ? '<div class="rw">' + wins.map(function (x) { return item(x[0], x[1]); }).join('') + '</div>' : '<div class="sb" style="padding:10px 0">아직 값이 없어요</div>');
  return '<div class="cd"><div class="hd"><b class="tt" style="color:' + color + '">' + logo(kind) + esc(title) + '</b><span class="sb' + (old ? ' old' : '') + '">' + (aiTs ? ago(age) + ' 갱신' : '') + (devName ? ' · ' + esc(devName) : '') + '</span></div>' + body + '</div>';
}
function meter(n, p) { return '<div class="mt"><div class="r"><span style="color:var(--dim)">' + n + '</span><b style="color:' + tone(p) + '">' + Math.round(p) + '%</b></div><div class="bar"><i style="width:' + Math.max(0, Math.min(100, p)) + '%;background:' + tone(p) + '"></i></div></div>'; }
function pcCard(d) {
  var s = d.sys, on = !!(s && !d.off && (nowSrv() - s.ts) < ONLINE_MS);
  var age = s && s.ts ? ago(nowSrv() - s.ts) : '';
  var pill = '<span class="pill ' + (on ? 'on' : 'off') + '">' + (on ? '켜짐' : '꺼짐') + (age ? ' · ' + age : '') + '</span>';
  var body = !s ? '<div class="sb" style="padding:6px 0 4px;font-size:12px">아직 값이 없어요</div>'
    : (on ? (s.cpu != null ? meter('CPU', s.cpu) : '') + (s.ram && s.ram.pct != null ? meter('RAM', s.ram.pct) + (s.ram.totalGb ? '<div class="sb" style="margin-top:4px;text-align:right">' + s.ram.usedGb + ' / ' + s.ram.totalGb + ' GB</div>' : '') : '')
      : '<div class="sb" style="padding:6px 0 4px;font-size:12px">마지막 값: CPU ' + (s.cpu == null ? '-' : Math.round(s.cpu) + '%') + ' · RAM ' + (s.ram && s.ram.pct != null ? Math.round(s.ram.pct) + '%' : '-') + '</div>');
  return '<div class="cd" style="' + (on ? '' : 'opacity:.78') + '"><div class="hd" style="align-items:center;margin-bottom:6px"><b>' + esc(d.name) + '</b>' + pill + '</div>' + body + '</div>';
}
function connState() {
  if (S.err && (!S.fetchedAt || Date.now() - S.fetchedAt > 30000)) return ['bad', '연결 끊김 · ' + (S.fetchedAt ? ago(Date.now() - S.fetchedAt) : '연결 중')];
  if (S.err) return ['warn', '재연결 중…'];
  if (!S.fetchedAt) return ['warn', '연결 중…'];
  return ['', '연결됨 · ' + ago(Date.now() - S.fetchedAt)];
}
function setupView() {
  return '<div class="top"><div class="tl"><b>지비스 사용량</b><small class="ver">v' + VER + '</small></div></div><div class="msg"><h2>연결 코드를 붙여넣어 주세요</h2>PC 지비스가 만든 «폰 사용량 연결 코드»를 한 번만 넣으면 이 폰에 기억돼요.'
    + '<textarea id="code" placeholder="JVUSG1:…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea><div class="err" id="cerr">' + esc(S.codeErr) + '</div>'
    + '<button class="btn" id="go">연결하기</button>' + (S.conn ? '<button class="btn sec" id="godef">기본 연결로 돌아가기</button>' : '') + '</div>';
}
function settingsView() {
  return '<div class="sheet"><div class="row"><h3>테마</h3><div class="chips" id="th">' + THEMES.map(function (t) { return '<button data-t="' + t[0] + '"' + (S.theme === t[0] ? ' class="on"' : '') + '>' + t[1] + '</button>'; }).join('') + '</div></div>'
    + '<div class="row"><h3>화면 꺼짐 방지</h3><div class="chips"><button id="wk"' + (S.wake ? ' class="on"' : '') + '>' + (S.wake ? '켜짐' : '꺼짐') + '</button></div></div>'
    + '<div class="row" style="margin:0"><h3>연결</h3><button class="btn sec" id="off" style="margin-top:0">' + (S.isDef ? '연결 코드 직접 넣기' : (S.confirmOff ? '정말 해제할까요? 한 번 더 누르세요' : '연결 해제(기본 연결로 돌아가기)')) + '</button>' + (S.isDef ? '<div class="sb" style="margin-top:6px">기본 연결(읽기 전용)로 보고 있어요. 코드는 안 넣어도 돼요.</div>' : '') + '</div></div>';
}
function mainView() {
  var cs = connState(), snap = S.snap, h = '';
  h += '<div class="top"><div class="tl"><b>지비스 사용량</b><small class="ver">v' + VER + '</small></div><div class="tr"><div class="conn ' + cs[0] + '"><i></i>' + cs[1] + '</div><button class="gear" id="fs" aria-label="' + (fsEl() ? '전체화면 끄기' : '전체화면 켜기') + '" aria-pressed="' + (fsEl() ? 'true' : 'false') + '">' + fsIcon(!!fsEl()) + '</button><button class="gear" id="gear" aria-label="설정">⚙</button></div></div>' + (S.fsNote ? '<div class="msg" style="font-size:13px;margin:0 0 12px">이 브라우저는 전체화면 버튼을 지원하지 않아요.<br>공유 메뉴에서 «홈 화면에 추가» 로 열면 주소창 없이 꽉 차게 보여요.<br><button class="btn sec" id="fsx" style="margin-top:8px">닫기</button></div>' : '');
  if (S.sheet) h += settingsView();
  if (!snap) return h + '<div class="msg">' + (S.err ? '중계에 연결하지 못했어요.<br>' + esc(S.err) + '<br>잠시 뒤 자동으로 다시 시도해요.' : '값을 불러오는 중…') + '</div>';
  var ai = snap.ai && snap.ai.data ? snap.ai : null, left = '';
  if (ai) {
    var d = ai.data;
    if (d.claude) left += aiCard('Claude', '#d97757', d.claude, ai.ts, ai.name, 'claude');
    if (d.gemini) left += aiCard('Gemini', '#4285F4', d.gemini, ai.ts, ai.name, 'gemini');
    if (d.gpt) left += aiCard('ChatGPT', '#10a37f', d.gpt, ai.ts, ai.name, 'gpt');
  }
  if (!left) left = '<div class="msg" style="font-size:13px">PC 지비스에서 사용량을 켜 두면 여기에 나와요.<br>(설정 → 사용량)</div>';
  var pcs = (snap.devices || []).map(pcCard).join('');   // 중계에 등록된 차례 그대로(LG 가 먼저)
  h += '<div class="gr"><div class="col">' + left + '</div><div class="pcs">' + (pcs || '<div class="msg" style="font-size:13px">켜진 PC 가 없어요.<br>PC 에서 지비스를 실행해 주세요.</div>') + '</div></div>';
  return h + '<div class="foot">지비스 사용량 v' + VER + ' · 10초마다 갱신</div>';
}
function paint() {
  if (!S.conn || S.manual) { app.innerHTML = setupView(); var g = document.getElementById('go'); if (g) g.onclick = connect; var gd = document.getElementById('godef'); if (gd) gd.onclick = useDefault; return; }
  var keep = document.activeElement && document.activeElement.id;
  app.innerHTML = mainView();
  bind();
}
/* ── 전체화면 켜고 끄기 ──
   ★ 브라우저 규칙상 «눌러서만» 켤 수 있고 앱을 다시 열면 풀린다(자동으로 켜 둘 수 없다).
   ★ 아이폰 사파리는 웹페이지 전체화면을 지원하지 않는다 — 그때는 «홈 화면에 추가» 로 열라고 알려 준다. */
function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
function fsOk() { var e = document.documentElement; return !!(e.requestFullscreen || e.webkitRequestFullscreen); }
function fsIcon(on) {
  return on
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
}
function fsToggle() {
  if (fsEl()) {                                                                   // 켜져 있으면 끈다
    var x = document.exitFullscreen || document.webkitExitFullscreen;
    try { var p = x && x.call(document); if (p && p.catch) p.catch(function () { /* 이미 풀렸다 */ }); } catch (e) { /* 위와 같다 */ }
    return;
  }
  if (!fsOk()) { S.fsNote = true; paint(); return; }                              // 지원하지 않는 브라우저
  var el = document.documentElement, rq = el.requestFullscreen || el.webkitRequestFullscreen;
  S.fsNote = false;
  try { var q = rq.call(el); if (q && q.catch) q.catch(function () { S.fsNote = true; paint(); }); } catch (er) { S.fsNote = true; paint(); }
}
document.addEventListener('fullscreenchange', function () { paint(); });
document.addEventListener('webkitfullscreenchange', function () { paint(); });
function bind() {
  var fsb = document.getElementById('fs'); if (fsb) fsb.onclick = fsToggle;
  var fsx = document.getElementById('fsx'); if (fsx) fsx.onclick = function () { S.fsNote = false; paint(); };
  var gear = document.getElementById('gear'); if (gear) gear.onclick = function () { S.sheet = !S.sheet; S.confirmOff = false; paint(); };
  var th = document.getElementById('th'); if (th) [].forEach.call(th.querySelectorAll('button'), function (b) { b.onclick = function () { setTheme(b.dataset.t); paint(); }; });
  var wk = document.getElementById('wk'); if (wk) wk.onclick = function () { S.wake = !S.wake; ls('jvu_wake', S.wake ? '1' : '0'); if (S.wake) wake(); else release(); paint(); };
  var off = document.getElementById('off'); if (off) off.onclick = function () {
    if (S.isDef) { S.manual = true; S.sheet = false; paint(); return; }                  // 기본 연결 중 → 직접 넣는 화면
    if (!S.confirmOff) { S.confirmOff = true; paint(); return; }
    ls('jvu_conn', null); S.sheet = false; S.confirmOff = false; stopPoll(); useDefault();   // 직접 넣은 코드를 지우면 기본 연결로
  };
}
function setTheme(t) {
  S.theme = t; document.documentElement.setAttribute('data-theme', t); ls('jvu_theme', t);
  var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  var m = document.querySelector('meta[name=theme-color]'); if (m && bg) m.setAttribute('content', bg);
}

/* ── 중계 읽기 ── */
function fetchSnap() {
  if (!S.conn || busy) return; busy = true;
  var ctrl = typeof AbortController === 'function' ? new AbortController() : null, to = ctrl && setTimeout(function () { ctrl.abort(); }, 20000);
  return fetch(S.conn.u + '?api=get&key=' + encodeURIComponent(S.conn.k), { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var j; try { j = JSON.parse(t); } catch (e) { throw new Error('중계 응답을 읽지 못했어요'); }
      if (!j.ok) throw new Error(j.msg || '중계가 거절했어요');
      S.snap = j; S.fetchedAt = Date.now(); S.err = ''; ls('jvu_last', JSON.stringify({ snap: j, at: S.fetchedAt }));
    })
    .catch(function (e) { S.err = e && e.name === 'AbortError' ? '응답이 늦어요' : (e && e.message) || '연결 실패'; })
    .then(function () { if (to) clearTimeout(to); busy = false; paint(); });
}
function startPoll() { stopPoll(); fetchSnap(); timer = setInterval(function () { if (document.visibilityState === 'visible') fetchSnap(); else paint(); }, POLL_MS); }
function stopPoll() { if (timer) { clearInterval(timer); timer = null; } }
function useDefault() {
  S.conn = { u: DEF.u, k: DEF.k }; S.isDef = true; S.manual = false; S.snap = null; S.fetchedAt = 0; S.err = ''; S.codeErr = '';
  paint(); startPoll();
}
function connect() {
  var el = document.getElementById('code'), c = parseCode(el && el.value);
  if (!c) { S.codeErr = '연결 코드가 맞지 않아요. JVUSG1: 로 시작하는 전체를 붙여넣어 주세요.'; paint(); return; }
  S.codeErr = ''; S.conn = c; S.isDef = false; S.manual = false; ls('jvu_conn', JSON.stringify(c)); S.snap = null; S.fetchedAt = 0; S.err = ''; paint(); startPoll();
}

/* ── 화면 꺼짐 방지 ── */
function wake() {
  if (!S.wake || !navigator.wakeLock || document.visibilityState !== 'visible' || wl) return;
  navigator.wakeLock.request('screen').then(function (l) { wl = l; l.addEventListener('release', function () { wl = null; }); }).catch(function () { /* 허락 안 됨 */ });
}
function release() { if (wl) { wl.release().catch(function () {}); wl = null; } }

/* ── 시작 ── */
var th0 = ls('jvu_theme'); setTheme(THEMES.some(function (t) { return t[0] === th0; }) ? th0 : 'slatelight');
S.wake = ls('jvu_wake') !== '0';
/* ★ 주소 뒤 코드는 «지우지 않는다» — 아이폰 사파리의 «홈 화면에 추가»는 그 순간 주소창의 URL 을
   그대로 아이콘에 저장한다. 여기서 지워 버리면(예전엔 history.replaceState 로 지웠음) 정작
   «홈 화면에 추가»를 누르는 시점엔 이미 코드 없는 민짜 주소만 남아 있어서, 그 아이콘으로 다시
   열 때마다 코드를 새로 넣으라고 나왔다(2026-09-28 실측). 화면 자체는 전체 화면(standalone)
   모드라 평소엔 주소창이 안 보이므로 지저분해 보이는 것도 아니다. */
var hashCode = parseCode(location.hash); if (hashCode) { ls('jvu_conn', JSON.stringify(hashCode)); }
try { S.conn = JSON.parse(ls('jvu_conn') || 'null'); if (S.conn && !parseCode('JVUSG1:' + btoa(unescape(encodeURIComponent(JSON.stringify(S.conn)))))) S.conn = null; } catch (e) { S.conn = null; }
if (!S.conn) { S.conn = { u: DEF.u, k: DEF.k }; S.isDef = true; }
try { var last = JSON.parse(ls('jvu_last') || 'null'); if (last && last.snap && S.conn) { S.snap = last.snap; S.fetchedAt = last.at; } } catch (e) { /* 무시 */ }
paint();
if (S.conn) startPoll();
setInterval(function () { if (S.conn && document.visibilityState === 'visible' && !document.activeElement.matches('textarea')) paint(); }, 1000);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { wake(); fetchSnap(); } });
document.addEventListener('pointerdown', function () { wake(); }, { passive: true });
window.addEventListener('online', function () { fetchSnap(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () { /* 무시 */ });
window.__jvu = { S: S, parseCode: parseCode, fetchSnap: fetchSnap, paint: paint, setTheme: setTheme };
})();
</script>
